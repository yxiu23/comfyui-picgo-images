<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<title>AI 多媒体生成工作台</title>
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#0a0e18;color:#9aa5c0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.box{text-align:center;padding:28px}.spinner{width:24px;height:24px;margin:0 auto 12px;border:3px solid rgba(59,110,245,.22);border-top-color:#3b6ef5;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}a{color:#3b6ef5;text-decoration:none;margin:0 8px}p{margin:6px 0}
</style>
<script>
(function(){
  var mobile=/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  var narrow=Math.min(window.innerWidth||9999,document.documentElement.clientWidth||9999)<768;
  var target=(mobile||narrow)?'ai-workbench-mobile-final.html':'ai-multimedia-workbench-final.html';
  window.location.replace(target);
})();
</script>
</head>
<body>
<div class="box"><div class="spinner"></div><p>正在进入工作台…</p><p><a href="ai-multimedia-workbench-final.html">电脑版</a>·<a href="ai-workbench-mobile-final.html">手机版</a></p></div>
</body>
</html>
