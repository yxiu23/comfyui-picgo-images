<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 多媒体生成工作台</title>
<script>
// 设备检测：手机跳转手机版，电脑用电脑版
(function() {
  var ua = navigator.userAgent.toLowerCase();
  var isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua);
  var screenWidth = window.screen.width;
  if (isMobile || screenWidth < 768) {
    window.location.href = 'ai-workbench-mobile.html';
  } else {
    window.location.href = 'ai-multimedia-workbench.html';
  }
})();
</script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px;background:#0a0e18;color:#9aa5c0;">
<p>正在跳转...</p>
<p style="font-size:12px;margin-top:10px;"><a href="ai-multimedia-workbench.html" style="color:#3b6ef5;">电脑版</a> · <a href="ai-workbench-mobile.html" style="color:#3b6ef5;">手机版</a></p>
</body>
</html>
