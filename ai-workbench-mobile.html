<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI 工作台</title>
<style>
/* ========== 主题变量 ========== */
:root {
  --brand: #3b6ef5;
  --brand-soft: rgba(59,110,245,.12);
  --danger: #e5484d;
  --success: #16a34a;
  --warning: #f59e0b;
  --transition: 200ms cubic-bezier(.4,0,.2,1);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg: #0a0e18; --bg-elev: #111726; --surface: #1a2030; --surface-2: #232a3d;
  --border: rgba(148,163,209,.1); --text: #e9edf8; --text-muted: #9aa5c0; --text-dim: #5f6b8a;
  --overlay: rgba(0,0,0,.6);
  --bg-grad: radial-gradient(600px 400px at 80% -10%, rgba(59,110,245,.08), transparent 60%);
}
[data-theme="light"] {
  --bg: #f6f7fb; --bg-elev: #ffffff; --surface: #ffffff; --surface-2: #f0f2f8;
  --border: #e3e6ee; --text: #1c1f26; --text-muted: #5a6172; --text-dim: #8b91a0;
  --overlay: rgba(0,0,0,.4);
  --bg-grad: radial-gradient(600px 400px at 80% -10%, rgba(59,110,245,.05), transparent 60%);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
  background: var(--bg-grad), var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; padding-top: var(--safe-top);
}
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
input, textarea, select {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; outline: none; width: 100%; -webkit-appearance: none; font-size: 15px;
  transition: border-color var(--transition);
}
input:focus, textarea:focus { border-color: var(--brand); }
textarea { resize: none; min-height: 80px; }
select { background-image: none; }
::-webkit-scrollbar { width: 0; height: 0; }
::selection { background: var(--brand-soft); }

/* ========== Header ========== */
.header {
  height: 44px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; background: var(--bg-elev); border-bottom: 1px solid var(--border); z-index: 30;
}
.header-title { font-size: 16px; font-weight: 600; }
.header-btn {
  width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); transition: all var(--transition);
}
.header-btn:active { background: var(--surface-2); }
.header-btn svg { width: 20px; height: 20px; }

/* ========== 内容区 ========== */
.content {
  height: calc(100vh - 44px - 56px - var(--safe-top) - var(--safe-bottom));
  overflow: hidden; position: relative;
}
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; padding: 12px 12px 20px; }
.view.active { display: block; }

/* ========== 参数视图 ========== */
.section { margin-bottom: 16px; }
.section-label {
  font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.preset-row { display: flex; gap: 6px; margin-bottom: 8px; }
.preset-select {
  flex: 1; font-size: 12px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text-muted);
}
.preset-save {
  width: 32px; height: 32px; border-radius: 8px; background: var(--brand-soft); color: var(--brand);
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
}
.model-btn {
  width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 14px;
}
.model-btn:active { background: var(--surface-2); }
.model-btn svg { width: 16px; height: 16px; color: var(--text-dim); }
.model-meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
.tag.price { background: rgba(22,163,74,.1); color: var(--success); }
.tag.async { background: var(--brand-soft); color: var(--brand); }
.tag.sync { background: rgba(245,158,11,.1); color: var(--warning); }

/* 表单 */
.form-group { margin-bottom: 14px; }
.form-group label { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; font-size: 13px; font-weight: 500; }
.form-group .req { color: var(--danger); font-size: 11px; }
.form-group .opt { color: var(--text-dim); font-size: 11px; font-weight: 400; }
.form-group .hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.form-group.error input, .form-group.error textarea { border-color: var(--danger); }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input[type=range] {
  flex: 1; appearance: none; -webkit-appearance: none; height: 6px;
  background: var(--surface-2); border-radius: 3px; padding: 0; border: none;
}
.range-row input[type=range]::-webkit-slider-thumb {
  appearance: none; -webkit-appearance: none; width: 28px; height: 28px;
  border-radius: 50%; background: var(--brand);
}
.range-value { font-family: monospace; font-size: 13px; font-weight: 600; color: var(--brand); min-width: 40px; text-align: right; }

/* 参考图 */
.ref-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 8px; }
.ref-item { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: var(--surface-2); }
.ref-item img { width: 100%; height: 100%; object-fit: cover; }
.ref-badge { position: absolute; top: 4px; left: 4px; font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 999px; }
.ref-badge.local { color: #fcd34d; background: rgba(251,191,36,.2); }
.ref-badge.uploaded { color: #6ee7b7; background: rgba(52,211,153,.16); }
.ref-del { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 5px; background: rgba(0,0,0,.6); color: #fca5a5; font-size: 12px; display: grid; place-items: center; }
.ref-add { aspect-ratio: 1; border: 2px dashed var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--brand); background: var(--brand-soft); }
.ref-add svg { width: 24px; height: 24px; }
.ref-empty { grid-column: 1/-1; text-align: center; padding: 16px; font-size: 12px; color: var(--text-dim); border: 1px dashed var(--border); border-radius: 10px; }
.ref-progress { display: none; align-items: center; gap: 6px; margin-top: 6px; padding: 6px 10px; background: var(--brand-soft); border-radius: 8px; font-size: 12px; color: var(--brand); }
.ref-progress.show { display: flex; }
.ref-progress .ring { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--brand); border-top-color: transparent; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 生成按钮 */
.estimate { text-align: center; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
.estimate .val { color: var(--success); font-weight: 600; font-family: monospace; }
.gen-btn {
  width: 100%; padding: 14px; background: var(--brand); color: white; border-radius: 12px;
  font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all var(--transition); position: sticky; bottom: 0; z-index: 10;
}
.gen-btn:active { transform: scale(.98); }
.gen-btn:disabled { opacity: .5; }

/* ========== 结果视图 ========== */
.result-list { display: flex; flex-direction: column; gap: 12px; }
.empty { display: flex; flex-direction: column; align-items: center; padding: 60px 20px; text-align: center; color: var(--text-dim); }
.empty svg { width: 56px; height: 56px; opacity: .4; margin-bottom: 12px; }
.empty h3 { font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; }
.empty p { font-size: 12px; }

/* 任务卡 */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.card-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.card-model { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 500; flex-shrink: 0; }
.pill.running { background: var(--brand-soft); color: var(--brand); }
.pill.success { background: rgba(22,163,74,.12); color: var(--success); }
.pill.failed { background: rgba(229,72,77,.12); color: var(--danger); }
.pill.timeout { background: rgba(245,158,11,.12); color: var(--warning); }
.card-prompt { padding: 8px 12px; font-size: 11px; color: var(--text-muted); background: var(--surface-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-body { padding: 10px 12px; }
.task-id { font-family: monospace; font-size: 10px; color: var(--text-dim); background: var(--surface-2); padding: 4px 8px; border-radius: 6px; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
.task-id .copy { padding: 2px 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: 9px; color: var(--brand); }
.bar { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; position: relative; }
.bar::after { content: ""; position: absolute; left: -40%; top: 0; height: 100%; width: 40%; background: var(--brand); animation: ind 1.4s infinite ease-in-out; }
@keyframes ind { 0% { left: -40%; } 100% { left: 100%; } }
.timer { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: flex; align-items: center; gap: 4px; }
.timer .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
.poll-actions { display: flex; gap: 6px; margin-top: 8px; }
.poll-actions .act { flex: 1; }

/* 结果展示 */
.media { width: 100%; border-radius: 10px; background: var(--surface-2); overflow: hidden; margin-bottom: 8px; display: flex; justify-content: center; }
.media img, .media video { max-width: 100%; max-height: 300px; display: block; }
.media audio { width: 100%; padding: 12px; }
.url-row { display: flex; gap: 4px; align-items: center; background: var(--surface-2); padding: 4px 8px; border-radius: 6px; font-size: 10px; font-family: monospace; color: var(--text-muted); word-break: break-all; }
.url-row .copy { flex-shrink: 0; padding: 3px 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: 10px; color: var(--brand); }
.actions { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.act {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; padding: 8px 10px; font-size: 11px;
  background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); border-radius: 8px;
  transition: all var(--transition);
}
.act:active { background: var(--brand-soft); }
.act svg { width: 16px; height: 16px; }
.act.danger { color: var(--danger); }
.err-banner { background: rgba(229,72,77,.1); color: var(--danger); padding: 8px 10px; border-radius: 8px; font-size: 11px; margin-bottom: 8px; }

/* ========== 底部 Tab ========== */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; height: calc(56px + var(--safe-bottom));
  padding-bottom: var(--safe-bottom); background: var(--bg-elev); border-top: 1px solid var(--border);
  display: flex; z-index: 20;
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text-dim); font-size: 10px; position: relative; transition: color var(--transition);
}
.tab svg { width: 22px; height: 22px; }
.tab.active { color: var(--brand); }
.tab.active::before { content: ""; position: absolute; top: 0; width: 24px; height: 3px; background: var(--brand); border-radius: 0 0 3px 3px; }

/* ========== Sheet ========== */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 90; opacity: 0; pointer-events: none; transition: opacity var(--transition); }
.overlay.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-elev); border-radius: 16px 16px 0 0;
  max-height: 85vh; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 100;
  transform: translateY(100%); transition: transform 280ms cubic-bezier(.4,0,.2,1); padding: 20px 16px calc(20px + var(--safe-bottom));
}
.sheet.show { transform: translateY(0); }
.handle { width: 36px; height: 4px; background: var(--text-dim); border-radius: 2px; margin: 0 auto 16px; opacity: .5; }
.sheet h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; text-align: center; }
.sheet-group { margin-bottom: 16px; }
.sheet-group > label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.sheet-actions .act { flex: 1; min-width: 72px; justify-content: center; padding: 12px; font-size: 12px; }

/* 模型选择器 */
.model-list { display: flex; flex-direction: column; gap: 8px; }
.model-item { padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; transition: all var(--transition); }
.model-item:active { background: var(--surface-2); }
.model-item.selected { border-color: var(--brand); background: var(--brand-soft); }
.model-item-name { font-size: 14px; font-weight: 600; }
.model-item-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.model-item-price { font-size: 12px; color: var(--success); font-weight: 600; margin-top: 4px; }

/* ========== Toast ========== */
.toasts { position: fixed; top: 48px; right: 8px; left: 8px; z-index: 200; display: flex; flex-direction: column; gap: 6px; }
.toast {
  background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--text-dim);
  border-radius: 10px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  font-size: 12px; display: flex; gap: 8px; animation: tin 280ms ease-out;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
.toast.info { border-left-color: var(--brand); }
.toast .msg { flex: 1; word-break: break-word; }
.toast .ta { display: flex; gap: 4px; }
.toast .tab { padding: 2px 8px; font-size: 11px; border-radius: 4px; background: var(--surface-2); color: var(--brand); border: 1px solid var(--border); }
@keyframes tin { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ========== 编辑器 ========== */
.editor { position: fixed; inset: 0; background: var(--bg-elev); z-index: 150; display: none; flex-direction: column; padding-top: var(--safe-top); }
.editor.show { display: flex; }
.editor-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--border); height: 44px; flex-shrink: 0; }
.editor-header h3 { font-size: 15px; margin: 0; }
.editor-body { flex: 1; overflow-y: auto; padding: 12px; }
.editor-tools { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px; background: var(--surface-2); border-radius: 10px; margin-bottom: 8px; }
.tg { display: flex; align-items: center; gap: 3px; padding-right: 6px; border-right: 1px solid var(--border); }
.tg:last-child { border-right: none; }
.tb { padding: 6px 8px; font-size: 11px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
.tb.active { background: var(--brand); color: white; border-color: var(--brand); }
.sb { padding: 4px 6px; font-size: 10px; border-radius: 5px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
.sb.active { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
.cb { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; }
.cb.active { border-color: var(--text); transform: scale(1.1); }
.or { width: 60px; appearance: none; -webkit-appearance: none; height: 4px; background: var(--surface); border-radius: 2px; padding: 0; border: none; }
.or::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--brand); }
.dc { font-size: 11px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 2px; }
.dc input { width: auto; margin: 0; }
.op-ctrl { display: none; padding: 8px; background: var(--brand-soft); border-radius: 8px; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; align-items: center; }
.canvas-wrap { position: relative; background: var(--surface-2); border-radius: 10px; overflow: auto; max-height: 45vh; display: flex; justify-content: center; align-items: center; min-height: 180px; padding: 8px; }
.canvas-stack { position: relative; display: inline-block; }
#bgCanvas, #maskCanvas { display: block; max-width: 100%; max-height: 45vh; }
#bgCanvas { position: relative; z-index: 1; }
#maskCanvas { position: absolute; top: 0; left: 0; z-index: 2; background: transparent; }
.canvas-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 12px; pointer-events: none; }
.canvas-hint.hide { display: none; }
.editor-prompt { min-height: 50px; font-size: 13px; }

/* ========== Modal ========== */
.modal { position: fixed; inset: 0; background: var(--overlay); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal.show { display: flex; }
.modal-content { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 16px; padding: 20px; max-width: 100%; width: 100%; max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal-header h3 { font-size: 15px; }
.modal-body { font-size: 13px; }
.modal-body pre { background: var(--surface-2); padding: 8px; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 11px; margin: 6px 0; }
.modal-body .kv { display: flex; padding: 5px 0; border-bottom: 1px solid var(--border); gap: 10px; }
.modal-body .kv-k { width: 80px; color: var(--text-muted); flex-shrink: 0; font-size: 11px; }
.modal-body .kv-v { flex: 1; word-break: break-all; font-family: monospace; font-size: 11px; }
.modal-footer { display: flex; gap: 8px; margin-top: 16px; }
.modal-footer .act { flex: 1; justify-content: center; padding: 10px; }
.pi { width: 100%; padding: 10px; font-size: 14px; margin: 8px 0; }

/* 统计 */
.stabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.srb { padding: 5px 12px; font-size: 11px; border-radius: 999px; color: var(--text-muted); background: var(--surface-2); }
.srb.active { background: var(--brand); color: white; }
.ssum { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 16px; }
.sc { background: var(--surface-2); border-radius: 8px; padding: 10px; text-align: center; }
.sc-main { background: var(--brand-soft); grid-column: 1/-1; text-align: left; }
.sl { font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
.sv { font-size: 18px; font-weight: 700; color: var(--brand); font-family: monospace; }
.svs { font-size: 15px; font-weight: 600; font-family: monospace; }
.ssec { margin-bottom: 14px; }
.sst { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
.sbr { display: grid; grid-template-columns: 80px 1fr 60px; gap: 8px; align-items: center; margin-bottom: 6px; }
.sbl { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbb { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.sbf { height: 100%; background: var(--brand); border-radius: 3px; }
.sbc { font-size: 11px; font-family: monospace; color: var(--success); text-align: right; }
</style>
</head>
<body>

<!-- ========== Header ========== -->
<div class="header">

const fmtTime = ts => { if (!ts) return ''; const d = new Date(ts); const p = n => String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const fmtDur = ms => { const s = Math.floor(ms/1000); const m = Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`; };

function calcEstimate(model, body) {
  if (!model.billing) return null;
  const b = model.billing;
  if (b.type === 'perImage') return { amount: b.unit, label: `${b.unit} 元/张` };
  if (b.type === 'perSecond') {
    if (b.durationKey && body[b.durationKey]) { const d = Number(body[b.durationKey]); return { amount: d*b.unit, label: `${d}s × ${b.unit}` }; }
    return { amount: null, label: b.note || '按时长' };
  }
  if (b.type === 'perChar') { const len = (body[b.charKey]||'').length; return { amount: len*b.unit, label: `${len}字 × ${b.unit}` }; }
  if (b.type === 'perCall') return { amount: b.unit, label: `${b.unit} 元/次` };
  return null;
}

function classifyErr(msg) {
  const m = (msg||'').toLowerCase();
  if (/密钥|key|auth/.test(m)) return { hint: '检查API密钥', fix: () => { openSettings(); $('#apiKeyInput').focus(); } };
  if (/余额|balance/.test(m)) return { hint: '账户余额不足' };
  if (/参数|param/.test(m)) return { hint: '参数格式错误' };
  if (/网络|fetch|cors/.test(m)) return { hint: '网络异常或跨域限制' };
  return { hint: msg || '未知错误' };
}

// ==================== Toast ====================
const Toast = {
  show(msg, type = 'info', opts = {}) {
    const { duration = 3500, actions = [] } = opts;
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    const acts = actions.length ? `<div class="ta">${actions.map(a => `<button class="tab" data-a="${esc(a.action||'')}">${esc(a.label)}</button>`).join('')}</div>` : '';
    el.innerHTML = `<div class="msg">${esc(msg)}</div>${acts}<button class="tab" style="font-size:14px;line-height:1">×</button>`;
    $('#toasts').appendChild(el);
    const close = () => { el.style.animation = 'tin 200ms reverse'; setTimeout(() => el.remove(), 200); };
    el.querySelectorAll('.tab').forEach(b => {
      b.onclick = () => { const a = actions.find(x => x.action === b.dataset.a); if (a && a.onClick) a.onClick(); close(); };
    });
    if (duration > 0) setTimeout(close, duration);
  },
  success(m, o) { this.show(m, 'success', o); },
  error(m, o) { this.show(m, 'error', { duration: 5000, ...o }); },
  warning(m, o) { this.show(m, 'warning', o); },
  info(m, o) { this.show(m, 'info', o); }
};

// ==================== API ====================
const Api = {
  async submit(endpoint, body) {
    const key = Store.getApiKey(); if (!key) throw new Error('NO_API_KEY');
    let r; try { r = await fetch(CONFIG.API_BASE + endpoint, { method: 'POST', headers: { Authorization: key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
    catch { throw new Error('NETWORK_OR_CORS'); }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  },
  async syncCall(endpoint, body) {
    const key = Store.getApiKey(); if (!key) throw new Error('NO_API_KEY');
    let r; try { r = await fetch(CONFIG.API_BASE + endpoint, { method: 'POST', headers: { Authorization: key, 'Content-Type': 'application/json;charset:utf-8;' }, body: JSON.stringify(body) }); }
    catch { throw new Error('NETWORK_OR_CORS'); }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  },
  async queryDetail(id) {
    const key = Store.getApiKey(); if (!key) throw new Error('NO_API_KEY');
    let r; try { r = await fetch(`${CONFIG.API_BASE}${CONFIG.DETAIL_PATH}?id=${encodeURIComponent(id)}`, { headers: { Authorization: key, 'Content-Type': 'application/json' }, cache: 'no-store' }); }
    catch { throw new Error('NETWORK_OR_CORS'); }
    if (r.status === 429) { const e = new Error('RATE_LIMITED'); e.retryAfter = parseInt(r.headers.get('Retry-After')||'0',10)||0; throw e; }
    if (!r.ok) throw new Error(`查询失败 ${r.status}`);
    return r.json();
  },
  extractUrl(d) {
    if (!d) return null;
    const data = d.data;
    const isUrl = s => typeof s === 'string' && /^https?:\/\/\S+/i.test(s) && s.length < 2000;
    const keys = ['url','video_url','image_url','audio_url','result','result_url','demo_audio','file_url','download_url','output_url','video','image','audio'];
    for (const k of keys) { if (isUrl(data?.[k])) return data[k]; if (Array.isArray(data?.[k]) && data[k].length && isUrl(data[k][0])) return data[k][0]; }
    if (isUrl(data)) return data;
    if (typeof data === 'string' && data.trim().startsWith('{')) { try { return this.extractUrl({ data: JSON.parse(data) }); } catch {} }
    return this._deepFind(data);
  },
  _deepFind(obj, d = 0) {
    if (!obj || d > 6) return null;
    const isUrl = s => typeof s === 'string' && /^https?:\/\/\S+/i.test(s) && s.length < 2000;
    if (typeof obj === 'string') return isUrl(obj) ? obj : null;
    if (Array.isArray(obj)) { for (const it of obj) { const u = this._deepFind(it, d+1); if (u) return u; } return null; }
    if (typeof obj === 'object') { for (const v of Object.values(obj)) { const u = this._deepFind(v, d+1); if (u) return u; } }
    return null;
  },
  async uploadGithub(dataUrl) {
    const m = /^data:([^;,]+)(;base64)?,([\s\S]*)$/.exec(dataUrl);
    if (!m) throw new Error('data URL 解析失败');
    const mime = (m[1]||'image/png').toLowerCase();
    const content = m[2] ? m[3] : btoa(unescape(encodeURIComponent(decodeURIComponent(m[3]))));
    const extMap = { 'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif' };
    const ext = extMap[mime] || 'png';
    const name = `${Date.now()}-${Math.random().toString(36).slice(2,10)}.${ext}`;
    const url = `https://api.github.com/repos/${CONFIG.GITHUB.REPO}/contents/${CONFIG.GITHUB.PATH}/${name}`;
    let r; try { r = await fetch(url, { method: 'PUT', headers: { Authorization: `Bearer ${CONFIG.GITHUB.TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify({ message: `upload: ${name}`, content, branch: CONFIG.GITHUB.BRANCH }) }); }
    catch (e) { throw new Error(`GitHub 连接失败`); }
    let j = null; try { j = await r.json(); } catch {}
    if (r.ok && j?.content?.path) return `${CONFIG.GITHUB.RAW_BASE}/${j.content.name}`;
    const em = { 401:'Token 无效', 403:'无写权限', 404:'仓库不存在', 422:'文件冲突' };
    throw new Error(em[r.status] || `上传失败 ${r.status}`);
  },
  _cache: {},
  getCached(d) { return this._cache[d]; },
  setCached(d, u) { this._cache[d] = u; }
};

// ==================== 轮询器 ====================
class Poller {
  constructor() { this.timers = {}; this.polls = {}; }
  getPhase(elapsed) { for (const p of CONFIG.POLL_PHASES) { if (elapsed < p.until) return p; } return CONFIG.POLL_PHASES[CONFIG.POLL_PHASES.length - 1]; }
  start(task) {
    if (this.timers[task.id]) return;
    const st = { count: 0, netFails: 0, startAt: task.startTime || Date.now(), stopped: false, _timer: null };
    this.polls[task.id] = st;
    Store.updateTask(task.id, { status: 'running', startTime: st.startAt });
    UI.renderResults();
    this.timers[task.id] = setInterval(() => {
      const t = Store.getTasks().find(x => x.id === task.id);
      if (!t || t.status !== 'running') { this.stop(task.id); return; }
      const elapsed = Date.now() - st.startAt;
      Store.updateTask(task.id, { elapsed });
      UI.updateTimer(task.id, elapsed, st);
    }, 500);
    const tick = async () => {
      st._timer = null;
      if (st.stopped) return;
      if (Date.now() - st.startAt >= CONFIG.POLL_TIMEOUT) { this.onTimeout(task.id); return; }
      st.count++;
      try {
        const detail = await Api.queryDetail(task.apiId);
        st.netFails = 0;
        const status = detail?.data?.status;
        Store.updateTask(task.id, { lastStatus: status });
        if (status === 2) {
          const url = Api.extractUrl(detail);
          const elapsed = Date.now() - st.startAt;
          this.stop(task.id);
          Store.updateTask(task.id, { status: 'success', resultUrl: url, rawDetail: detail, endTime: Date.now(), elapsed });
          Store.updateHistory(task.historyId, { status: 'success', resultUrl: url, endTime: Date.now(), elapsed });
          UI.renderResults();
          if (url) { Toast.success(`${task.modelName} 成功`, { actions: [{ label: '查看', onClick: () => UI.switchView('result') }] }); UI.playSound(); UI.notify(task.modelName, false); }
          else Toast.warning('任务成功但未提取到URL');
          return;
        } else if (status === 3) {
          const err = detail?.data?.message || '生成失败';
          this.stop(task.id);
          Store.updateTask(task.id, { status: 'failed', error: err, endTime: Date.now() });
          Store.updateHistory(task.historyId, { status: 'failed', error: err, endTime: Date.now() });
          UI.renderResults();
          Toast.error(`${task.modelName} 失败: ${err}`);
          UI.notify(task.modelName, true, err);
          return;
        }
        st._timer = setTimeout(tick, this.getPhase(Date.now() - st.startAt).interval);
      } catch (e) {
        if (e.message === 'RATE_LIMITED') {
          st.rateFails = (st.rateFails||0) + 1;
          const backoff = e.retryAfter > 0 ? e.retryAfter*1000 : Math.min(10000 * Math.pow(2, st.rateFails-1), 60000);
          st._timer = setTimeout(tick, backoff);
          return;
        }
        st.netFails++;
        if (e.message === 'NO_API_KEY') { this.stop(task.id); Store.updateTask(task.id, { status: 'failed', error: 'API密钥缺失' }); UI.renderResults(); Toast.error('请先填写API密钥'); return; }
        if (e.message === 'NETWORK_OR_CORS') { this.stop(task.id); Store.updateTask(task.id, { status: 'failed', error: '网络/CORS错误' }); UI.renderResults(); return; }
        if (st.netFails >= CONFIG.POLL_FAIL_LIMIT) { this.stop(task.id); Store.updateTask(task.id, { status: 'failed', error: `连续${st.netFails}次失败` }); UI.renderResults(); Toast.error('查询失败'); return; }
        st._timer = setTimeout(tick, this.getPhase(Date.now() - st.startAt).interval);
      }
    };
    tick();
  }
  onTimeout(id) {
    this.stop(id);
    const t = Store.getTasks().find(x => x.id === id);
    if (!t) return;
    Store.updateTask(id, { status: 'timeout', error: '超时(10分钟)，可手动刷新', endTime: Date.now() });
    Store.updateHistory(t.historyId, { status: 'timeout', endTime: Date.now() });
    UI.renderResults();
    Toast.warning('轮询超时');
  }
  stop(id) { if (this.timers[id]) { clearInterval(this.timers[id]); delete this.timers[id]; } const st = this.polls[id]; if (st) { if (st._timer) clearTimeout(st._timer); st.stopped = true; delete this.polls[id]; } }
  async refresh(id) {
    const t = Store.getTasks().find(x => x.id === id);
    if (!t || !t.apiId) return;
    Toast.info('查询中…');
    try {
      const d = await Api.queryDetail(t.apiId);
      const s = d?.data?.status;
      if (s === 2) { const url = Api.extractUrl(d); this.stop(id); Store.updateTask(id, { status: 'success', resultUrl: url, endTime: Date.now() }); Store.updateHistory(t.historyId, { status: 'success', resultUrl: url, endTime: Date.now() }); UI.renderResults(); Toast.success('成功'); UI.playSound(); }
      else if (s === 3) { this.stop(id); Store.updateTask(id, { status: 'failed', error: d?.data?.message||'失败', endTime: Date.now() }); UI.renderResults(); Toast.error('生成失败'); }
      else { Toast.info('仍在生成中'); if (!this.timers[id]) this.start({ id: t.id, apiId: t.apiId, modelName: t.modelName, startTime: t.startTime, historyId: t.historyId }); }
    } catch (e) { Toast.error('查询失败: ' + e.message); }
  }
  resumeAll() { Store.getTasks().filter(t => t.status === 'running').forEach(t => this.start({ id: t.id, apiId: t.apiId, modelName: t.modelName, startTime: t.startTime, historyId: t.historyId })); }
}
const poller = new Poller();

    this.restoreFormFromCache();
    this.updateEstimate();
    this.renderPresets();
  },

  renderForm(mid) {
    const model = MODELS[this.tab].find(m => m.id === mid);
    this.model = model;
    if (!this.refState[this.tab+'/'+mid]) this.refState[this.tab+'/'+mid] = {};
    this.currentRefKey = this.tab+'/'+mid;
    // meta
    $('#modelMeta').innerHTML = `<span class="tag price">${model.price}</span><span class="tag ${model.async?'async':'sync'}">${model.async?'异步':'同步'}</span>`;
    // 表单
    const f = $('#paramForm');
    f.innerHTML = '';
    model.params.forEach(p => {
      const g = document.createElement('div');
      g.className = 'form-group'; g.dataset.key = p.key;
      const label = `<label>${esc(p.label)} ${p.required?'<span class="req">*</span>':'<span class="opt">(可选)</span>'}</label>`;
      const defVal = p.default != null ? String(p.default) : '';
      let input = '';
      if (p.type === 'textarea') input = `<textarea data-key="${p.key}" placeholder="${esc(p.placeholder||'')}">${esc(defVal)}</textarea>`;
      else if (p.type === 'select') input = `<select data-key="${p.key}">${p.options.map(o => `<option value="${typeof o==='object'?o.value:o}" ${o===defVal||(typeof o==='object'&&o.value===defVal)?'selected':''}>${typeof o==='object'?o.label:o}</option>`).join('')}</select>`;
      else if (p.type === 'datalist') input = `<input type="text" data-key="${p.key}" value="${esc(defVal)}" list="dl-${p.key}"><datalist id="dl-${p.key}">${p.options.map(o => `<option value="${typeof o==='object'?o.value:o}">${typeof o==='object'?o.label:o}</option>`).join('')}</datalist>`;
      else if (p.type === 'range') { const unit = p.unit||''; input = `<div class="range-row"><input type="range" data-key="${p.key}" value="${esc(defVal)}" min="${p.min}" max="${p.max}" step="${p.step||1}"><span class="range-value" id="rv-${p.key}">${defVal}${unit}</span></div>`; }
      else if (p.type === 'ref-image') { if (!this.refState[this.currentRefKey][p.key]) this.refState[this.currentRefKey][p.key] = []; input = this.renderRefGrid(p.key); }
      else input = `<input type="text" data-key="${p.key}" value="${esc(defVal)}" placeholder="${esc(p.placeholder||'')}">`;
      const hint = p.hint ? `<div class="hint">${esc(p.hint)}</div>` : '';
      g.innerHTML = label + input + hint;
      f.appendChild(g);
    });
    // 绑定事件
    $$('[data-key]', f).forEach(el => { el.oninput = () => { if (el.type === 'range') { const rv = $('#rv-'+el.dataset.key); if (rv) rv.textContent = el.value + (this.model.params.find(p=>p.key===el.dataset.key)?.unit||''); } this.updateEstimate(); }; });
    $$('.ref-add', f).forEach(b => b.onclick = () => { const inp = $('#refFile-'+b.dataset.key); if (inp) inp.click(); });
    $$('input[type=file]', f).forEach(inp => inp.onchange = e => { Array.from(e.target.files||[]).forEach(file => this.addRef(file, inp.id.replace('refFile-',''))); e.target.value=''; });
    $$('.ref-del', f).forEach(b => b.onclick = e => { e.stopPropagation(); this.removeRef(b.dataset.key, b.dataset.rid); });
  },

  renderRefGrid(key) {
    const refs = this.getRefs(key);
    const items = refs.length ? refs.map(r => {
      const badge = r.kind==='local' ? `<span class="ref-badge ${r.uploaded?'uploaded':'local'}">${r.uploaded?'已传':'本地'}</span>` : '';
      const body = r.kind==='local' ? `<img src="${esc(r.src)}" loading="lazy">` : '';
      return `<div class="ref-item">${badge}${body}<button class="ref-del" data-key="${key}" data-rid="${r.id}">×</button></div>`;
    }).join('') : '';
    const empty = refs.length ? '' : '';
    const addBtn = `<div class="ref-add" data-key="${key}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><input type="file" id="refFile-${key}" accept="image/*" multiple style="display:none">`;
    return `<div class="ref-grid" data-key="${key}">${items}${empty}${addBtn}</div><div class="ref-progress" id="rp-${key}"><div class="ring"></div><span id="rpt-${key}">上传中…</span></div>`;
  },

  getRefs(key) { return this.refState[this.currentRefKey]?.[key] || []; },

  addRef(file, key) {
    if (!/^image\//.test(file.type)) return Toast.error('非图片文件');
    if (file.size > 10*1024*1024) return Toast.error('图片过大');
    const r = new FileReader();
    r.onload = () => { this.getRefs(key).push({ id: 'r_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), kind: 'local', src: r.result, name: file.name, uploaded: false, remote: null }); this.refreshRefGrid(key); Toast.success('已添加'); };
    r.readAsDataURL(file);
  },
  removeRef(key, id) { const refs = this.getRefs(key); const i = refs.findIndex(r => r.id === id); if (i >= 0) refs.splice(i, 1); this.refreshRefGrid(key); },
  refreshRefGrid(key) { const grid = $(`.ref-grid[data-key="${key}"]`); if (grid) { const wrap = grid.parentElement; wrap.innerHTML = this.renderRefGrid(key); this.bindRefEvents(key); } },
  bindRefEvents(key) { const f = $('#paramForm'); $$('.ref-add', f).forEach(b => b.onclick = () => { const inp = $('#refFile-'+b.dataset.key); if (inp) inp.click(); }); $$('input[type=file]', f).forEach(inp => inp.onchange = e => { Array.from(e.target.files||[]).forEach(file => this.addRef(file, inp.id.replace('refFile-',''))); e.target.value=''; }); $$('.ref-del', f).forEach(b => b.onclick = e => { e.stopPropagation(); this.removeRef(b.dataset.key, b.dataset.rid); }); },

  collectParamsSync() {
    const body = {}; const f = $('#paramForm'); if (!f) return body;
    this.model.params.forEach(p => {
      if (p.type === 'ref-image') return;
      const el = f.querySelector(`[data-key="${p.key}"]`);
      if (!el) return;
      let val = el.value.trim();
      if (p.type === 'range') val = Number(val);
      if (val !== '') body[p.key] = val;
    });
    return body;
  },

  async collectParamsAsync() {
    const body = {}; const errors = []; const f = $('#paramForm');
    for (const p of this.model.params) {
      const g = f.querySelector(`.form-group[data-key="${p.key}"]`); let val = null;
      if (p.type === 'ref-image') {
        const refs = this.getRefs(p.key);
        if (refs.length > 0) {
          const pending = refs.filter(r => r.kind === 'local' && !r.uploaded);
          if (pending.length > 0) {
            const prog = $('#rp-'+p.key); if (prog) prog.classList.add('show');
            const results = await Promise.all(pending.map(async r => {
              try { let u = Api.getCached(r.src); if (!u) { u = await Api.uploadGithub(r.src); Api.setCached(r.src, u); } r.remote = u; r.uploaded = true; return { ok: true }; }
              catch (e) { return { ok: false, name: r.name, msg: e.message }; }
            }));
            this.refreshRefGrid(p.key);
            if (prog) prog.classList.remove('show');
            const fails = results.filter(x => !x.ok);
            if (fails.length) { errors.push(fails.map(f => `${f.name}: ${f.msg}`).join('; ')); continue; }
          }
          const urls = refs.map(r => r.remote || r.src).filter(u => !/^data:/i.test(u));
          if (urls.length) body[p.key] = p.output === 'csv' ? urls.join(',') : urls;
        }
      } else {
        const el = f.querySelector(`[data-key="${p.key}"]`);
        val = el.value.trim();
        if (p.type === 'range') val = Number(val);
        if (val !== '') body[p.key] = val;
      }
      if (p.required && (val == null || val === '' || (Array.isArray(val) && !val.length) || (body[p.key] == null))) { errors.push(p.label); g.classList.add('error'); }
      else g.classList.remove('error');
    }
    return { body, errors };
  },

  updateEstimate() {
    if (!this.model) return;
    const est = calcEstimate(this.model, this.collectParamsSync());
    const el = $('#estimate');
    if (!est) { el.innerHTML = ''; return; }
    el.innerHTML = est.amount != null ? `预计 <span class="val">¥${est.amount < 1 ? est.amount.toFixed(4) : est.amount.toFixed(2)}</span> · ${esc(est.label)}` : `<span style="color:var(--warning)">${esc(est.label)}</span>`;
  },

  saveFormToCache() {
    if (!this.model) return;
    const key = this.tab + '_' + this.model.id;
    const params = {}; const f = $('#paramForm'); if (!f) return;
    this.model.params.forEach(p => {
      if (p.type === 'ref-image') { const refs = this.getRefs(p.key); if (refs.length) params[p.key] = refs; }
      else { const el = f.querySelector(`[data-key="${p.key}"]`); if (el) params[p.key] = el.value; }
    });
    this.formCache[key] = params; this.formCache[this.tab + '_model'] = this.model.id;
  },

  restoreFormFromCache() {
    if (!this.model) return;
    const saved = this.formCache[this.tab + '_' + this.model.id];
    if (!saved) return;
    const f = $('#paramForm'); if (!f) return;
    this.model.params.forEach(p => {
      if (saved[p.key] === undefined) return;
      const g = f.querySelector(`.form-group[data-key="${p.key}"]`);
      if (p.type === 'ref-image') { const refs = saved[p.key]; if (Array.isArray(refs)) refs.forEach(r => { if (r.kind === 'url') this.getRefs(p.key).push(r); else this.getRefs(p.key).push(r); }); this.refreshRefGrid(p.key); }
      else if (p.type === 'range') { const el = g?.querySelector(`[data-key="${p.key}"]`); if (el) { el.value = saved[p.key]; const rv = $('#rv-'+p.key); if (rv) rv.textContent = saved[p.key] + (p.unit||''); } }
      else { const el = g?.querySelector(`[data-key="${p.key}"]`); if (el) el.value = saved[p.key]; }
    });
    this.updateEstimate();
  },

  async handleGenerate() {
    if (!Store.getApiKey()) { this.openSheet('settingsSheet', 'settingsOverlay'); Toast.error('请先填写API密钥'); return; }
    if (!this.model) return;
    const btn = $('#genBtn'); btn.disabled = true; $('#genBtnText').textContent = '处理中…';
    try {
      const { body, errors } = await this.collectParamsAsync();
      if (errors.length) { Toast.error(errors.join('；')); return; }
      const promptVal = body.prompt || body.text || body.video_url || body.videoName || body.audio_url || '';
      if (promptVal) { const ph = JSON.parse(localStorage.getItem('sc_prompt_history')||'[]').filter(p=>p!==promptVal); ph.unshift(promptVal); if (ph.length>20) ph.length=20; localStorage.setItem('sc_prompt_history', JSON.stringify(ph)); }
      const summary = trunc(promptVal, 40);
      const taskId = genId(); const historyId = 'h_'+taskId.slice(2); const now = Date.now();
      if (this.model.async) {
        Toast.info('提交中…');
        let resp; try { resp = await Api.submit(this.model.endpoint, body); }
        catch (e) { Toast.error(e.message === 'NO_API_KEY' ? '请先填写API密钥' : e.message === 'NETWORK_OR_CORS' ? '网络/CORS错误' : '提交失败: '+e.message); return; }
        if (resp.code !== 200) { Toast.error(`API错误: ${resp.msg||''}`); return; }
        const apiId = resp.data?.id; if (!apiId) { Toast.error('未返回任务ID'); return; }
        Toast.success('已提交');
        Store.addTask({ id: taskId, apiId, historyId, tab: this.tab, modelId: this.model.id, modelName: this.model.name, type: this.model.type, params: body, prompt: summary, status: 'running', startTime: now, async: true, createdAt: now });
        Store.addHistory({ id: historyId, taskId, apiId, tab: this.tab, modelId: this.model.id, modelName: this.model.name, type: this.model.type, params: body, prompt: summary, status: 'running', startTime: now, createdAt: now });
        this.renderResults();
        poller.start({ id: taskId, apiId, modelName: this.model.name, startTime: now, historyId });
        this.switchView('result');
      } else {
        Toast.info('调用中…');
        Store.addTask({ id: taskId, historyId, tab: this.tab, modelId: this.model.id, modelName: this.model.name, type: this.model.type, params: body, prompt: summary, status: 'running', startTime: now, async: false, createdAt: now });
        Store.addHistory({ id: historyId, taskId, tab: this.tab, modelId: this.model.id, modelName: this.model.name, type: this.model.type, params: body, prompt: summary, status: 'running', startTime: now, createdAt: now });
        this.renderResults();
        try {
          const resp = await Api.syncCall(this.model.endpoint, body);
          if (resp.code !== 200) throw new Error(resp.msg || '错误');
          const url = resp.data?.url || resp.data?.demo_audio || Api.extractUrl(resp) || '';
          if (!url) throw new Error('未返回URL');
          Store.updateTask(taskId, { status: 'success', resultUrl: url, endTime: Date.now() });
          Store.updateHistory(historyId, { status: 'success', resultUrl: url, endTime: Date.now() });
          Toast.success('成功'); this.playSound();
        } catch (e) { Store.updateTask(taskId, { status: 'failed', error: e.message, endTime: Date.now() }); Store.updateHistory(historyId, { status: 'failed', error: e.message, endTime: Date.now() }); Toast.error('失败: '+e.message); }
        this.renderResults();
      }
    } finally { btn.disabled = false; $('#genBtnText').textContent = '生成'; }
  },

  switchView(view) {
    $$('.view').forEach(v => v.classList.remove('active'));
    $('#'+view+'View').classList.add('active');
  },

  renderResults() {
    const list = $('#resultList');
    let tasks = Store.getTasks();
    $('#resultList').innerHTML = '';
    if (tasks.length === 0) {
      list.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><h3>暂无任务</h3><p>填写参数并点击「生成」</p></div>`;
      return;
    }
    const visible = tasks.slice(0, this.page);
    list.innerHTML = visible.map(t => this.renderCard(t)).join('');
    if (tasks.length > visible.length) {
      list.innerHTML += `<button class="act" style="justify-content:center;margin-top:8px" id="loadMore">加载更多（剩余 ${tasks.length - visible.length}）</button>`;
      $('#loadMore').onclick = () => { this.page += 20; this.renderResults(); };
    }
    this.bindCardEvents();
  },

  renderCard(t) {
    const st = { running:'生成中', success:'成功', failed:'失败', timeout:'超时' }[t.status] || t.status;
    const sc = t.status === 'timeout' ? 'timeout' : t.status;
    const prompt = t.prompt || trunc(JSON.stringify(t.params).slice(0,60),40);
    let body = '';
    if (t.status === 'running') {
      const elapsed = t.elapsed || (Date.now()-(t.startTime||Date.now()));
      const phase = poller.getPhase(elapsed)?.name || '';
      const interval = (poller.getPhase(elapsed)?.interval || 3000) / 1000;
      body = `${t.apiId ? `<div class="task-id">ID: ${esc(t.apiId)} <button class="copy" data-url="${esc(t.apiId)}">复制</button></div>` : ''}<div class="bar"></div><div class="timer"><span class="dot"></span>${fmtDur(elapsed)} · ${esc(phase)} ${interval}s</div><div class="poll-actions"><button class="act" data-refresh="${t.id}">刷新</button><button class="act danger" data-stop="${t.id}">停止</button></div>`;
    } else if (t.status === 'success' && t.resultUrl) {
      const m = t.type === 'image' ? `<img src="${esc(t.resultUrl)}" loading="lazy" referrerpolicy="no-referrer">` : t.type === 'video' ? `<video src="${esc(t.resultUrl)}" controls preload="metadata"></video>` : `<audio src="${esc(t.resultUrl)}" controls></audio>`;
      body = `<div class="media">${m}</div><div class="url-row"><span style="flex:1">${esc(t.resultUrl)}</span><button class="copy" data-url="${esc(t.resultUrl)}">复制</button></div><div class="actions"><button class="act" data-copy="${esc(t.resultUrl)}">📋</button><a class="act" href="${esc(t.resultUrl)}" download>⬇</a>${t.type==='image' ? `<button class="act" data-edit="${esc(t.resultUrl)}">✏</button>` : ''}<button class="act" data-ref="${esc(t.resultUrl)}" data-type="${t.type}">📌</button><button class="act" data-regen="${t.id}">🔄</button><button class="act danger" data-del="${t.id}">🗑</button></div>`;
    } else if (t.status === 'failed' || t.status === 'timeout') {
      const cls = classifyErr(t.error);
      body = `<div class="err-banner">${esc(t.error||'错误')}${cls.hint ? `<br><span style="font-size:10px;color:var(--text-dim)">${esc(cls.hint)}</span>` : ''}</div>${t.apiId ? `<div class="poll-actions"><button class="act" data-refresh="${t.id}">刷新</button></div>` : ''}<div class="actions"><button class="act" data-regen="${t.id}">🔄</button><button class="act danger" data-del="${t.id}">🗑</button></div>`;
    }
    return `<div class="card" data-id="${t.id}"><div class="card-top"><span class="card-model">${esc(t.modelName)}</span><span class="pill ${sc}">${st}</span></div><div class="card-prompt">${esc(prompt)}</div><div class="card-body">${body}</div></div>`;
  },

  bindCardEvents() {
    $$('.copy').forEach(b => b.onclick = async () => { await copy(b.dataset.url); Toast.success('已复制'); });
    $$('[data-copy]').forEach(b => b.onclick = async () => { await copy(b.dataset.copy); Toast.success('已复制'); });
    $$('[data-refresh]').forEach(b => b.onclick = () => poller.refresh(b.dataset.refresh));
    $$('[data-stop]').forEach(b => b.onclick = () => { poller.stop(b.dataset.stop); Store.updateTask(b.dataset.stop, { status: 'stopped', error: '已停止', endTime: Date.now() }); UI.renderResults(); });
    $$('[data-edit]').forEach(b => b.onclick = () => this.openEditor(b.dataset.edit));
    $$('[data-ref]').forEach(b => b.onclick = () => this.useAsRef(b.dataset.ref, b.dataset.type));
    $$('[data-regen]').forEach(b => b.onclick = () => this.regen(b.dataset.regen));
    $$('[data-del]').forEach(b => b.onclick = () => { poller.stop(b.dataset.del); Store.delTask(b.dataset.del); this.renderResults(); });
  },

  updateTimer(id, elapsed, st) {
    const card = $(`.card[data-id="${id}"]`); if (!card) return;
    const timer = card.querySelector('.timer');
    if (timer) { const phase = poller.getPhase(elapsed)?.name || ''; const interval = (poller.getPhase(elapsed)?.interval||3000)/1000; timer.innerHTML = `<span class="dot"></span>${fmtDur(elapsed)} · ${esc(phase)} ${interval}s${st.netFails>0?` · 失败${st.netFails}/${CONFIG.POLL_FAIL_LIMIT}`:''}`; }
  },

  useAsRef(url, type) {
    if (!url) return;
    if (type === 'image') {
      if (this.tab !== 'image') this.switchTab('image');
      const refParam = this.model?.params.find(p => p.type === 'ref-image');
      if (refParam) { this.getRefs(refParam.key).push({ id: 'r_'+Date.now().toString(36), kind: 'url', src: url, name: 'URL', uploaded: true, remote: url }); this.refreshRefGrid(refParam.key); Toast.success('已添加参考图'); }
    } else {
      const t = type === 'video' ? 'video' : 'audio';
      if (this.tab !== t) this.switchTab(t);
      const p = this.model?.params.find(x => x.type === 'url' && /url/i.test(x.label)) || this.model?.params.find(x => x.type === 'text');
      if (p) { const g = $(`.form-group[data-key="${p.key}"]`); const inp = g?.querySelector('input,textarea'); if (inp) inp.value = inp.value.trim() ? inp.value+','+url : url; Toast.success('已填入'); }
    }
    this.switchView('param');
  },

  regen(id) {
    const t = Store.getTasks().find(x => x.id === id); if (!t) return;
    this.switchTab(t.tab);
    const m = MODELS[t.tab].find(x => x.id === t.modelId);
    if (m) { $('#modelBtnText').textContent = m.name; this.renderForm(m.id); }
    Object.entries(t.params||{}).forEach(([k, v]) => {
      const g = $(`.form-group[data-key="${k}"]`); if (!g) return;
      const p = this.model?.params.find(x => x.key === k); if (!p) return;
      if (p.type === 'ref-image') { const urls = Array.isArray(v) ? v : String(v).split(',').map(s=>s.trim()).filter(Boolean); urls.forEach(u => this.getRefs(k).push({ id:'r_'+Date.now().toString(36), kind:'url', src:u, name:'URL', uploaded:true, remote:u })); this.refreshRefGrid(k); }
      else { const el = g.querySelector('input,textarea,select'); if (el) el.value = Array.isArray(v) ? v.join(',') : v; }
    });
    this.updateEstimate();
    this.switchView('param');
    Toast.info('已恢复参数');
  },

  // ===== 预设 =====
  renderPresets() {
    // 内置预设（风格选择器）
    const builtin = BUILTIN_PRESETS[this.tab] || [];
    const builtinHtml = builtin.length ? builtin.map((p, i) => `<button class="act" data-builtin="${i}" style="font-size:11px;padding:6px 8px;flex-shrink:0;border-radius:8px;">${esc(p.name)}</button>`).join('') : '';
    // 用户预设
    const user = Store.getPresets();
    const userHtml = user.length ? user.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('') : '';
    // 渲染到参数视图
    let presetArea = $('#builtinPresets');
    if (!presetArea) {
      presetArea = document.createElement('div');
      presetArea.id = 'builtinPresets';
      presetArea.style.cssText = 'display:flex;gap:4px;overflow-x:auto;margin-bottom:8px;-webkit-overflow-scrolling:touch;';
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = '常用预设';
      const form = $('#paramForm');
      form.parentNode.insertBefore(label, form);
      form.parentNode.insertBefore(presetArea, form);
    }
    presetArea.innerHTML = builtinHtml;
    $$('#builtinPresets .act').forEach(b => b.onclick = () => {
      const idx = +b.dataset.builtin;
      const preset = builtin[idx];
      // 填入 prompt
      const promptKey = this.model.params.find(p => p.key === 'prompt' || p.key === 'text')?.key;
      if (promptKey) {
        const ta = $(`textarea[data-key="${promptKey}"]`);
        if (ta) { ta.value = preset.prompt; ta.dispatchEvent(new Event('input')); }
      }
      // 高亮选中
      $$('#builtinPresets .act').forEach(x => x.style.background = '');
      b.style.background = 'var(--brand-soft)';
      b.style.color = 'var(--brand)';
      Toast.success(`已套用：${preset.name}`);
    });
    // 用户预设下拉
    const sel = $('#presetSelect');
    sel.innerHTML = '<option value="">我的预设</option>' + userHtml;

  // ===== 编辑器 =====
  editor: { canvas: null, ctx: null, bg: null, bgCtx: null, img: null, origSrc: null, tool: 'rect', color: '255,0,0', opacity: 0.5, brushSize: 30, expandSize: 256, feather: 8, isDrawing: false, startX: 0, startY: 0, undoStack: [], rectSnap: null, curBrush: null },

  openEditor(url) {
    if (!url) return;
    $('#editor').classList.add('show');
    $('#canvasHint').textContent = '加载中…'; $('#canvasHint').classList.remove('hide');
    const img = new Image();
    img.onload = () => { this.editor.img = img; this.editor.origSrc = url; this.initEditorCanvas(); $('#canvasHint').classList.add('hide'); };
    img.onerror = () => { $('#canvasHint').textContent = '加载失败'; };
    img.src = url;
    $('#editorPrompt').value = '';
  },
  initEditorCanvas() {
    const m = $('#maskCanvas'); const c = m.getContext('2d');
    const b = $('#bgCanvas'); const bc = b.getContext('2d');
    const img = this.editor.img; const MAX = 1024;
    let w = img.naturalWidth, h = img.naturalHeight;
    if (w > MAX || h > MAX) { const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
    m.width = w; m.height = h; b.width = w; b.height = h;
    bc.drawImage(img, 0, 0, w, h); c.clearRect(0, 0, w, h);
    this.editor.canvas = m; this.editor.ctx = c; this.editor.bg = b; this.editor.bgCtx = bc;
    this.editor.undoStack = []; this.pushUndo(); this.bindEditorEvents();
    const bg2 = $('#brushSizeGroup'); if (bg2) { const nb = this.editor.tool === 'brush' || this.editor.tool === 'eraser'; bg2.style.opacity = nb ? '1' : '0.4'; bg2.style.pointerEvents = nb ? 'auto' : 'none'; }
    const op = $('#outpaintCtrl'); if (op) op.style.display = this.editor.tool === 'outpaint' ? 'flex' : 'none';
  },
  bindEditorEvents() {
    $('#editorCloseBtn').onclick = () => $('#editor').classList.remove('show');
    $$('.tb[data-tool]').forEach(b => b.onclick = () => {
      $$('.tb[data-tool]').forEach(x => x.classList.remove('active')); b.classList.add('active');
      this.editor.tool = b.dataset.tool;
      const bg = $('#brushSizeGroup'); if (bg) { const nb = this.editor.tool === 'brush' || this.editor.tool === 'eraser'; bg.style.opacity = nb ? '1' : '0.4'; bg.style.pointerEvents = nb ? 'auto' : 'none'; }
      const op = $('#outpaintCtrl'); if (op) op.style.display = this.editor.tool === 'outpaint' ? 'flex' : 'none';
    });
    $$('.sb[data-size]').forEach(b => b.onclick = () => { $$('.sb[data-size]').forEach(x => x.classList.remove('active')); b.classList.add('active'); this.editor.brushSize = +b.dataset.size; });
    $$('.cb').forEach(b => b.onclick = () => { $$('.cb').forEach(x => x.classList.remove('active')); b.classList.add('active'); this.editor.color = b.dataset.color; });
    $('#opacitySlider').oninput = e => { this.editor.opacity = +e.target.value / 100; $('#opacityValue').textContent = e.target.value + '%'; };
    $('#featherSlider').oninput = e => { this.editor.feather = +e.target.value; $('#featherValue').textContent = e.target.value + 'px'; };
    $$('.sb[data-expand]').forEach(b => b.onclick = () => { $$('.sb[data-expand]').forEach(x => x.classList.remove('active')); b.classList.add('active'); this.editor.expandSize = +b.dataset.expand; });
    $('#applyOutpaintBtn').onclick = () => this.applyOutpaint();
    $('#undoBtn').onclick = () => this.undoEditor();
    $('#clearBtn').onclick = () => { this.editor.ctx.clearRect(0, 0, this.editor.canvas.width, this.editor.canvas.height); this.editor.undoStack = []; this.pushUndo(); };
    $('#editorConfirmBtn').onclick = () => this.confirmEditor();
    const c = this.editor.canvas;
    c.onmousedown = e => this.edDown(e); c.onmousemove = e => this.edMove(e); c.onmouseup = e => this.edUp(e); c.onmouseleave = e => this.edUp(e);
    c.ontouchstart = e => { e.preventDefault(); this.edDown(e.touches[0]); };
    c.ontouchmove = e => { e.preventDefault(); this.edMove(e.touches[0]); };
    c.ontouchend = e => { e.preventDefault(); const t = e.changedTouches[0]; this.edUp(t); };
  },
  edPos(e) { const r = this.editor.canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * (this.editor.canvas.width / r.width), y: (e.clientY - r.top) * (this.editor.canvas.height / r.height) }; },
  edDown(e) {
    if (!this.editor.img || this.editor.tool === 'outpaint') return;
    const p = this.edPos(e); this.editor.isDrawing = true; this.editor.startX = p.x; this.editor.startY = p.y;
    if (this.editor.tool === 'rect') { this.editor.rectSnap = this.snap(); }
    else { const c = this.editor.ctx; c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = this.editor.brushSize; c.strokeStyle = this.editor.tool === 'brush' ? `rgba(${this.editor.color},${this.editor.opacity})` : 'rgba(0,0,0,1)'; c.globalCompositeOperation = this.editor.tool === 'eraser' ? 'destination-out' : 'source-over'; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x+0.01, p.y+0.01); c.stroke(); c.globalCompositeOperation = 'source-over'; this.editor.curBrush = { type: this.editor.tool, color: this.editor.color, opacity: this.editor.opacity, size: this.editor.brushSize, points: [{x:p.x,y:p.y}] }; }
  },
  edMove(e) {
    if (!this.editor.isDrawing) return;
    const p = this.edPos(e); const c = this.editor.ctx;
    if (this.editor.tool === 'rect') { this.restore(this.editor.rectSnap); c.fillStyle = `rgba(${this.editor.color},${this.editor.opacity})`; c.fillRect(Math.min(this.editor.startX,p.x), Math.min(this.editor.startY,p.y), Math.abs(p.x-this.editor.startX), Math.abs(p.y-this.editor.startY)); }
    else { c.lineTo(p.x, p.y); c.stroke(); if (this.editor.curBrush) this.editor.curBrush.points.push({x:p.x,y:p.y}); }
  },
  edUp(e) {
    if (!this.editor.isDrawing) return;
    this.editor.isDrawing = false;
    if (this.editor.tool === 'rect' && e) { const p = this.edPos(e); const w = Math.abs(p.x-this.editor.startX), h = Math.abs(p.y-this.editor.startY); if (w > 2 && h > 2) { /* recorded */ } }
    if (this.editor.curBrush) { this.editor.curBrush = null; }

  },
  snap() { const t = document.createElement('canvas'); t.width = this.editor.canvas.width; t.height = this.editor.canvas.height; t.getContext('2d').drawImage(this.editor.canvas, 0, 0); return t; },
  restore(s) { if (!s) return; const c = this.editor.ctx; c.clearRect(0, 0, this.editor.canvas.width, this.editor.canvas.height); c.drawImage(s, 0, 0); },
  pushUndo() { if (this.editor.undoStack.length >= 20) this.editor.undoStack.shift(); const t = document.createElement('canvas'); t.width = this.editor.canvas.width; t.height = this.editor.canvas.height; t.getContext('2d').drawImage(this.editor.canvas, 0, 0); this.editor.undoStack.push(t); },
  undoEditor() { if (this.editor.undoStack.length <= 1) return Toast.info('最早状态'); this.editor.undoStack.pop(); const p = this.editor.undoStack[this.editor.undoStack.length-1]; if (!p) return; this.editor.canvas.width = p.width; this.editor.canvas.height = p.height; const c = this.editor.ctx; c.clearRect(0,0,p.width,p.height); c.drawImage(p,0,0); },
  applyOutpaint() {
    const top = $('#dirTop').checked, bot = $('#dirBottom').checked, left = $('#dirLeft').checked, right = $('#dirRight').checked;
    if (!top && !bot && !left && !right) return Toast.warning('选方向');
    const exp = this.editor.expandSize; const bg = this.editor.bg; const bc = this.editor.bgCtx; const mc = this.editor.canvas; const mctx = this.editor.ctx;
    const ow = bg.width, oh = bg.height; const nw = ow+(left?exp:0)+(right?exp:0), nh = oh+(top?exp:0)+(bot?exp:0); const ox = left?exp:0, oy = top?exp:0;
    const tmpBg = document.createElement('canvas'); tmpBg.width = ow; tmpBg.height = oh; tmpBg.getContext('2d').drawImage(bg, 0, 0);
    const tmpM = document.createElement('canvas'); tmpM.width = ow; tmpM.height = oh; tmpM.getContext('2d').drawImage(mc, 0, 0);
    bg.width = nw; bg.height = nh; mc.width = nw; mc.height = nh;
    bc.fillStyle = `rgba(${this.editor.color},${this.editor.opacity})`; bc.fillRect(0, 0, nw, nh);
    if (this.editor.feather > 0) { const f = this.editor.feather; bc.save(); bc.globalCompositeOperation = 'destination-out';
      if (top) { const g = bc.createLinearGradient(0,oy-f,0,oy+f); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,1)'); bc.fillStyle=g; bc.fillRect(ox,oy-f,ow,f*2); }
      if (bot) { const g = bc.createLinearGradient(0,oy+oh-f,0,oy+oh+f); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)'); bc.fillStyle=g; bc.fillRect(ox,oy+oh-f,ow,f*2); }
      if (left) { const g = bc.createLinearGradient(ox-f,0,ox+f,0); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,1)'); bc.fillStyle=g; bc.fillRect(ox-f,oy,f*2,oh); }
      if (right) { const g = bc.createLinearGradient(ox+ow-f,0,ox+ow+f,0); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)'); bc.fillStyle=g; bc.fillRect(ox+ow-f,oy,f*2,oh); }
      bc.restore();
    }

  async confirmEditor() {
    const prompt = $('#editorPrompt').value.trim();
    if (!prompt) return Toast.warning('请填写描述');
    const btn = $('#editorConfirmBtn'); btn.disabled = true; btn.textContent = '上传中…';
    try {
      const mc = this.editor.canvas; const bg = this.editor.bg;
      const w = Math.max(bg.width, mc.width), h = Math.max(bg.height, mc.height);
      let mergedUrl = null;
      // 尝试 weserv 代理获取干净原图
      try {
        const proxyUrl = 'https://images.weserv.nl/?url=' + encodeURIComponent(this.editor.origSrc.replace(/^https?:\/\//, ''));
        const cleanImg = await new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = proxyUrl; });
        const mc2 = document.createElement('canvas'); mc2.width = w; mc2.height = h; const c2 = mc2.getContext('2d');
        c2.fillStyle = '#fff'; c2.fillRect(0,0,w,h);

        c2.drawImage(mc, Math.round((w-mc.width)/2), Math.round((h-mc.height)/2));
        mergedUrl = mc2.toDataURL('image/png');
      } catch {}
      // 尝试直接合并
      if (!mergedUrl) {
        try { const mc2 = document.createElement('canvas'); mc2.width = w; mc2.height = h; const c2 = mc2.getContext('2d');
          c2.fillStyle = '#fff'; c2.fillRect(0,0,w,h); c2.drawImage(bg, Math.round((w-bg.width)/2), Math.round((h-bg.height)/2)); c2.drawImage(mc, Math.round((w-mc.width)/2), Math.round((h-mc.height)/2));
          mergedUrl = mc2.toDataURL('image/png');
        } catch {}
      }

      else { const maskUrl = mc.toDataURL('image/png'); refUrl = Api.getCached(maskUrl) || await Api.uploadGithub(maskUrl); Api.setCached(maskUrl, refUrl); Toast.info('仅上传蒙版'); }

      const pParam = this.model?.params.find(p => p.key === 'prompt');
      if (pParam) { const ta = $(`textarea[data-key="prompt"]`); if (ta) { ta.value = prompt; ta.dispatchEvent(new Event('input')); } }
      $('#editor').classList.remove('show');
      this.switchView('param');
      Toast.success('已填入参考图');
    } catch (e) { Toast.error('失败: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = '用作参考图'; }
  }
